<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Launcher kumpulan aplikasi PWA">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.png?v=2" type="image/png">
  <link rel="stylesheet" href="style.css">
  <title>ZIE Project</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="logo" href="https://github.com/zieezie23-rgb/Zie-s-Launcher" target="_blank" rel="noopener"><img src="assets/icon.png?v=2" alt="ZIE Project"></a>
      <div><span>PWA LAUNCHER</span></div>
    </div>
    <div class="topbar-actions">
      <button id="installBtn" class="icon-btn" hidden>Install</button>
      <button id="pullBtn" class="search-toggle" title="Tarik data dari Cloud" aria-label="Tarik data dari Cloud">⟳</button>
      <button id="exportBtn" class="search-toggle" title="Buka Google Sheets" aria-label="Buka Google Sheets">☁</button>
      <button id="addBtn" class="add-btn" title="Tambah aplikasi" aria-label="Tambah aplikasi">＋</button>
      <button id="searchToggle" class="search-toggle" title="Cari aplikasi" aria-label="Cari aplikasi">⌕</button>
      <input id="search" type="search" placeholder="Cari aplikasi..." autocomplete="off">
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">MY APPLICATIONS</p>
        <h1>Semua PWA, <em>satu tempat.</em></h1>
      </div>
    </section>

    <div id="empty" class="empty" hidden>
      <div class="empty-mark">?</div>
      <h2>Belum ada aplikasi</h2>
      <p>Tambahkan URL PWA pertamamu.</p>
    </div>

    <section id="catSections" class="cat-sections"></section>
  </main>

  <dialog id="appDialog">
    <form method="dialog" id="appForm">
      <div class="dialog-head">
        <h2 id="dialogTitle">Tambah aplikasi</h2>
        <button value="cancel" class="close">×</button>
      </div>
      <input type="hidden" id="appId">
      <label>Nama<input id="name" required maxlength="60" placeholder="Contoh: Finance"></label>
      <label>URL PWA<input id="url" type="url" required placeholder="https://example.com"></label>
      <label>Kategori<input id="cat" maxlength="30" placeholder="Tools"></label>
      <label>URL Repo<input id="repo" type="url" placeholder="https://github.com/user/repo"></label>
      <label class="check"><input id="favorite" type="checkbox"> Jadikan favorit</label>
      <div class="form-actions">
        <button type="button" id="deleteBtn" class="danger" hidden>Hapus</button>
        <button type="submit" class="primary">Simpan</button>
      </div>
    </form>
  </dialog>

  <template id="cardTpl">
    <article class="card">
      <div class="card-top">
        <a class="app-icon" target="_blank" rel="noopener"></a>
        <div class="card-body"><h3></h3><p></p></div>
      </div>
      <button class="fav" title="Favorite">☆</button>
      <div class="menu-wrap">
        <button class="menu-toggle" title="Menu">•••</button>
        <div class="menu">
          <button class="menu-edit" type="button">Edit</button>
          <button class="menu-repo" type="button">URL Repo</button>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
